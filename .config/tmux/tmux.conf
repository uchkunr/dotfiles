set -g prefix None
unbind C-b
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
setw -g mode-keys vi
set -g status-interval 1
set -g default-terminal "xterm-256color"

source ~/.config/tmux/statusline.conf

set-option -g default-command "which reattach-to-user-namespace > /dev/null && reattach-to-user-namespace -l $SHELL || $SHELL"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0


bind -n M-a new-window
bind -n M-s split-window -v
bind -n M-d split-window -h
bind -n M-q kill-window
bind -n M-x kill-pane
bind -n M-e next-window
bind -n M-w previous-window
bind -n M-g command-prompt "rename-window %%"
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-c copy-mode


# Conditional shell configuration: use fish if available in standard paths, otherwise fall back to system default
if-shell "test -x /opt/homebrew/bin/fish" "set -g default-shell /opt/homebrew/bin/fish; set -g default-command /opt/homebrew/bin/fish"
if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish; set -g default-command /usr/bin/fish"
if-shell "test -x /usr/local/bin/fish" "set -g default-shell /usr/local/bin/fish; set -g default-command /usr/local/bin/fish"
